<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar — Prisma360</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:            #0A0714;
            --bg-2:          #100A24;
            --surface:       #16102C;
            --surface-2:     #1D1642;
            --border:        rgba(255,255,255,0.07);

            --accent:        #3DD6FD;
            --accent-glow:   rgba(61,214,253,0.25);
            --accent-dim:    rgba(61,214,253,0.10);

            --accent-2:      #5D3DC5;
            --accent-2-dim:  rgba(93,61,197,0.12);

            --accent-3:      #B7DD47;
            --accent-3-dim:  rgba(183,221,71,0.12);

            --text:          #F3F1FC;
            --muted:         #9088AE;
            --subtle:        #362A57;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .login-bg {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 15% 10%, rgba(61,214,253,0.10) 0%, transparent 55%),
                radial-gradient(ellipse 50% 45% at 90% 90%, rgba(93,61,197,0.13) 0%, transparent 55%);
            pointer-events: none;
        }

        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 2.5rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1.4rem;
            text-decoration: none;
            color: var(--text);
        }
        .login-logo img { height: 32px; width: auto; }
        .login-logo span { color: var(--accent); }

        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.5rem;
        }

        .login-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1.6rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .login-sub {
            font-size: 0.98rem;
            color: var(--muted);
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-group { margin-bottom: 1.25rem; }
        .form-group label {
            display: block;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 0.5rem;
        }
        .form-group input {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.8rem 1rem;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text);
            transition: border-color 0.2s, background 0.2s;
        }
        .form-group input::placeholder { color: var(--muted); opacity: 0.7; }
        .form-group input:focus {
            outline: none;
            border-color: rgba(61,214,253,0.45);
            background: rgba(255,255,255,0.05);
        }

        .login-submit {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: linear-gradient(120deg, var(--accent) 0%, var(--accent-2) 100%);
            color: #fff;
            font-size: 0.98rem;
            font-weight: 700;
            padding: 1rem;
            border: none;
            border-radius: 100px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            margin-top: 0.5rem;
        }
        .login-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 32px var(--accent-glow); }
        .login-submit:disabled { opacity: 0.6; cursor: default; transform: none; box-shadow: none; }

        .login-status {
            margin-top: 1rem;
            font-size: 0.92rem;
            text-align: center;
            display: none;
        }
        .login-status.is-error { display: block; color: var(--accent-2); }
        .login-status.is-info { display: block; color: var(--muted); }

        .login-back {
            display: block;
            text-align: center;
            margin-top: 1.75rem;
            font-size: 0.9rem;
            color: var(--muted);
            text-decoration: none;
        }
        .login-back:hover { color: var(--accent); }
    </style>
</head>
<body>
    <div class="login-bg"></div>

    <div style="position: relative; z-index: 1; width: 100%; max-width: 400px;">
        <a href="index.html" class="login-logo">
            <img src="assets/logo.png" alt="Prisma360">
            Prisma<span>360</span>
        </a>

        <div class="login-card">
            <h1 class="login-title">Ingresar</h1>
            <p class="login-sub">Acceso interno para el equipo Prisma360</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="tu@email.com" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="login-submit" id="loginBtn">Iniciar sesión</button>
                <p class="login-status" id="loginStatus"></p>
            </form>
        </div>

        <a href="index.html" class="login-back">← Volver al sitio</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/supabase-config.js"></script>
    <script>
        const form = document.getElementById('loginForm');
        const btn = document.getElementById('loginBtn');
        const status = document.getElementById('loginStatus');

        if (SUPABASE_URL.startsWith('PENDIENTE_')) {
            btn.disabled = true;
            status.textContent = 'Configuración pendiente: falta conectar las credenciales de Supabase.';
            status.className = 'login-status is-info';
        } else {
            const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const showStatus = (msg, type) => {
                status.textContent = msg;
                status.className = 'login-status is-' + type;
            };

            // If already logged in, skip straight to the dashboard
            supabaseClient.auth.getSession().then(({ data }) => {
                if (data.session) window.location.href = 'bitacora.html';
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                btn.disabled = true;
                btn.textContent = 'Ingresando...';
                status.className = 'login-status';

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

                if (error) {
                    showStatus('Credenciales incorrectas. Intenta de nuevo.', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Iniciar sesión';
                } else {
                    window.location.href = 'bitacora.html';
                }
            });
        }
    </script>
</body>
</html>
